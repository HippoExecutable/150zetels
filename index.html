<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#111827"
    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Parliament" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>
      Parliament Seats - Parliament Seat & Coalition Majority Calculator
    </title>
    <meta
      name="description"
      content="Interactive parliament seat distribution and coalition majority calculator for Germany, France, the UK, Canada, the EU and more."
    />
    <link rel="canonical" href="https://parl.hsw.is/" />

    <meta
      property="og:title"
      content="Parliament Seats - Parliament Seat & Coalition Majority Calculator"
    />
    <meta
      property="og:description"
      content="Visualize parliamentary seat distributions and test coalition majorities for Germany, France, the UK, Canada, the EU and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://parl.hsw.is/" />
    <meta property="og:image" content="https://parl.hsw.is/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Parliament Seats - Parliament Seat & Coalition Majority Calculator"
    />
    <meta
      name="twitter:description"
      content="Visualize parliamentary seat distributions and test coalition majorities."
    />
    <meta name="twitter:image" content="https://parl.hsw.is/og-image.jpg" />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          // Embeds use ?theme=light|dark|auto, since the host page sets the look
          var t = params.has("embed")
            ? params.get("theme") || "light"
            : localStorage.getItem("theme");
          var d =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      style="
        display: block;
        background: #ffffff;
        color: #030712;
        padding: 16px;
        border-radius: 16px;
        margin: 8px auto;
        font-family: sans-serif;
        line-height: 1.5;
        border: 2px solid #e5e7eb;
        max-width: 720px;
      "
    >
      <h1 style="margin: 0 0 16px 0">
        Parliament Seats - Parliament Seat & Coalition Majority Calculator
      </h1>

      <p style="margin: 0 0 16px 0">
        Parliament Seats is an interactive tool for visualizing parliamentary
        seat distributions and checking whether a coalition reaches a majority.
      </p>

      <p style="margin: 0 0 16px 0">
        Supported examples include the European Union, Germany, Austria, the
        Netherlands, Belgium, the United Kingdom, South Africa, Australia,
        Canada, France, and New Zealand.
      </p>

      <p style="margin: 0 0 16px 0">
        You can also create a custom parliament configuration and test coalition
        combinations manually.
      </p>

      <h2 style="margin: 0 0 12px 0">Supported parliaments</h2>
      <ul style="margin: 0 0 16px 20px; padding: 0">
        <li>European Union</li>
        <li>Germany (Bundestag)</li>
        <li>Austria (Nationalrat)</li>
        <li>Netherlands (Tweede Kamer)</li>
        <li>Belgium (Kamer / Chambre)</li>
        <li>United Kingdom (House of Commons)</li>
        <li>South Africa (National Assembly)</li>
        <li>Australia (House of Representatives and Senate)</li>
        <li>Canada (House of Commons / Chambre des communes)</li>
        <li>France (Assemblée nationale)</li>
        <li>New Zealand (House of Representatives)</li>
      </ul>

      <p style="margin: 0 0 16px 0">
        This application works only with JavaScript enabled. Please enable
        JavaScript in your browser settings and reload the page to use this
        application.
      </p>

      <p style="margin: 0">
        &copy; 2026
        <a href="https://hsw.is" rel="noreferrer noopener" target="_blank"
          >HSW.is</a
        >
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
